<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPlay 🌎</title>
    <meta name="theme-color" content="#1b5e20">
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1b5e20, #81c784);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #app {
            width: 95%;
            max-width: 900px;
            text-align: center;
        }

        .install-area {
            margin: 0 0 20px;
        }

        #installAppButton {
            background: #ffca28;
            color: #333;
        }

        #installAppMessage {
            margin-top: 8px;
            font-size: 14px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        #menu {
            background: rgba(0, 0, 0, 0.5);
            padding: 35px;
            border-radius: 20px;
        }

        #menu p {
            font-size: 20px;
            margin: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #ffca28;
            color: #333;
            font-weight: bold;
        }

        button:hover {
            background: #ffd95a;
        }

        #jogoArea {
            display: none;
        }

        #placar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 20px;
            border-radius: 12px 12px 0 0;
            font-size: 20px;
        }

        canvas {
            width: 100%;
            max-width: 800px;
            height: auto;
            background: #7bd35a;
            border: 4px solid white;
            display: block;
            margin: auto;
        }

        #controles {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            justify-content: center;
            gap: 8px;
        }

        #controles button {
            padding: 10px;
            width: 60px;
            height: 55px;
            background: #ffffff;
            font-size: 22px;
        }

        #baixo {
            grid-column: 2;
        }

        #mensagem {
            margin-top: 15px;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            #placar {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <h1>🌎 EcoPlay</h1>

    <div class="install-area">
        <button id="installAppButton" type="button">⬇️ Baixar app</button>
        <p id="installAppMessage" aria-live="polite"></p>
    </div>

    <div id="menu">
        <p>🌱 Cuide do planeta!</p>
        <p>❤️ Cuide da sua saúde!</p>
        <p>📚 Teste seus conhecimentos!</p>

        <button onclick="iniciarJogo()">
            ▶️ JOGAR
        </button>
    </div>

    <div id="jogoArea">

        <div id="placar">
            <span>⭐ Pontos: <strong id="pontos">0</strong></span>
            <span>🎮 Fase: <strong id="fase">1</strong></span>
        </div>

        <canvas id="jogo" width="800" height="500"></canvas>

        <div id="controles">
            <div></div>

            <button
                ontouchstart="pressionar('ArrowUp')"
                ontouchend="soltar('ArrowUp')">
                ⬆️
            </button>

            <div></div>

            <button
                ontouchstart="pressionar('ArrowLeft')"
                ontouchend="soltar('ArrowLeft')">
                ⬅️
            </button>

            <button
                ontouchstart="pressionar('ArrowDown')"
                ontouchend="soltar('ArrowDown')">
                ⬇️
            </button>

            <button
                ontouchstart="pressionar('ArrowRight')"
                ontouchend="soltar('ArrowRight')">
                ➡️
            </button>
        </div>

        <div id="mensagem">
            Use as setas ou WASD para movimentar 🙂
        </div>

        <br>

        <button onclick="reiniciar()">
            🔄 Reiniciar
        </button>

    </div>

</div>

<script>
const canvas = document.getElementById("jogo");
const ctx = canvas.getContext("2d");

let pontos = 0;
let fase = 1;
let jogoTerminado = false;
let jogoIniciado = false;

const jogador = {
    x: 380,
    y: 230,
    tamanho: 35,
    velocidade: 5
};

let teclas = {};
let objetos = [];


// ==============================
// CONTROLES
// ==============================

document.addEventListener("keydown", function(event) {
    teclas[event.key] = true;
});

document.addEventListener("keyup", function(event) {
    teclas[event.key] = false;
});

function pressionar(tecla) {
    teclas[tecla] = true;
}

function soltar(tecla) {
    teclas[tecla] = false;
}


// ==============================
// INICIAR JOGO
// ==============================

function iniciarJogo() {

    document.getElementById("menu").style.display = "none";
    document.getElementById("jogoArea").style.display = "block";

    jogoIniciado = true;

    criarObjetos();
    atualizarPlacar();
    atualizar();
}


// ==============================
// CRIAR OBJETOS
// ==============================

function criarObjetos() {

    objetos = [];

    if (fase === 1) {

        for (let i = 0; i < 10; i++) {

            objetos.push({
                x: 50 + Math.random() * 700,
                y: 70 + Math.random() * 380,
                tamanho: 30,
                tipo: "lixo"
            });

        }
    }


    if (fase === 2) {

        for (let i = 0; i < 5; i++) {

            objetos.push({
                x: 50 + Math.random() * 700,
                y: 70 + Math.random() * 380,
                tamanho: 30,
                tipo: "fruta"
            });

        }

        for (let i = 0; i < 3; i++) {

            objetos.push({
                x: 50 + Math.random() * 700,
                y: 70 + Math.random() * 380,
                tamanho: 30,
                tipo: "agua"
            });

        }

        for (let i = 0; i < 3; i++) {

            objetos.push({
                x: 50 + Math.random() * 700,
                y: 70 + Math.random() * 380,
                tamanho: 30,
                tipo: "ruim"
            });

        }
    }
}


// ==============================
// FUNDO
// ==============================

function desenharFundo() {

    ctx.fillStyle = "#7bd35a";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font = "40px Arial";

    ctx.fillText("🌳", 20, 80);
    ctx.fillText("🌳", 720, 100);
    ctx.fillText("🌳", 30, 450);
    ctx.fillText("🌳", 720, 450);

    ctx.font = "20px Arial";
    ctx.fillStyle = "#146b2e";

    if (fase === 1) {

        ctx.fillText(
            "🌱 Fase 1: Cuide do meio ambiente!",
            20,
            30
        );

    }

    if (fase === 2) {

        ctx.fillText(
            "❤️ Fase 2: Cuide da sua saúde!",
            20,
            30
        );

    }

    if (fase === 3) {

        ctx.fillText(
            "📚 Fase 3: Teste seus conhecimentos!",
            20,
            30
        );

    }
}


// ==============================
// JOGADOR
// ==============================

function desenharJogador() {

    ctx.font = "35px Arial";

    ctx.fillText(
        "🙂",
        jogador.x,
        jogador.y + 30
    );
}


// ==============================
// OBJETOS
// ==============================

function desenharObjetos() {

    objetos.forEach(function(obj) {

        ctx.font = "30px Arial";

        if (obj.tipo === "lixo") {
            ctx.fillText("🗑️", obj.x, obj.y);
        }

        if (obj.tipo === "fruta") {
            ctx.fillText("🍎", obj.x, obj.y);
        }

        if (obj.tipo === "agua") {
            ctx.fillText("💧", obj.x, obj.y);
        }

        if (obj.tipo === "ruim") {
            ctx.fillText("🍔", obj.x, obj.y);
        }

    });
}


// ==============================
// MOVIMENTO
// ==============================

function moverJogador() {

    if (
        teclas["ArrowUp"] ||
        teclas["w"] ||
        teclas["W"]
    ) {
        jogador.y -= jogador.velocidade;
    }

    if (
        teclas["ArrowDown"] ||
        teclas["s"] ||
        teclas["S"]
    ) {
        jogador.y += jogador.velocidade;
    }

    if (
        teclas["ArrowLeft"] ||
        teclas["a"] ||
        teclas["A"]
    ) {
        jogador.x -= jogador.velocidade;
    }

    if (
        teclas["ArrowRight"] ||
        teclas["d"] ||
        teclas["D"]
    ) {
        jogador.x += jogador.velocidade;
    }


    jogador.x = Math.max(
        0,
        Math.min(
            canvas.width - jogador.tamanho,
            jogador.x
        )
    );

    jogador.y = Math.max(
        40,
        Math.min(
            canvas.height - jogador.tamanho,
            jogador.y
        )
    );
}


// ==============================
// COLISÃO
// ==============================

function colisao(a, b) {

    return (
        a.x < b.x + b.tamanho &&
        a.x + a.tamanho > b.x &&
        a.y < b.y + b.tamanho &&
        a.y + a.tamanho > b.y
    );
}


// ==============================
// VERIFICAR COLISÕES
// ==============================

function verificarColisoes() {

    for (
        let i = objetos.length - 1;
        i >= 0;
        i--
    ) {

        if (colisao(jogador, objetos[i])) {

            const objeto = objetos[i];


            if (objeto.tipo === "lixo") {

                pontos += 10;

            }


            if (objeto.tipo === "fruta") {

                pontos += 10;

            }


            if (objeto.tipo === "agua") {

                pontos += 10;

            }


            if (objeto.tipo === "ruim") {

                pontos -= 5;

            }


            objetos.splice(i, 1);
        }
    }


    atualizarPlacar();


    if (
        objetos.length === 0 &&
        fase < 3
    ) {

        proximaFase();

    }
}


// ==============================
// PLACAR
// ==============================

function atualizarPlacar() {

    document.getElementById("pontos").textContent = pontos;
    document.getElementById("fase").textContent = fase;
}


// ==============================
// PRÓXIMA FASE
// ==============================

function proximaFase() {

    if (fase === 1) {

        fase = 2;

        jogador.x = 380;
        jogador.y = 230;

        alert(
            "🎉 Fase 1 concluída!\n\n" +
            "Agora cuide da sua saúde!"
        );

        criarObjetos();
        atualizarPlacar();
    }


    else if (fase === 2) {

        fase = 3;

        atualizarPlacar();

        setTimeout(
            perguntas,
            500
        );
    }
}


// ==============================
// PERGUNTA
// ==============================

function perguntas() {

    const resposta = prompt(

        "📚 FASE 3 - ECOPLAY\n\n" +

        "Qual atitude ajuda o meio ambiente?\n\n" +

        "A) Jogar lixo no chão\n" +
        "B) Reciclar\n" +
        "C) Desperdiçar água\n\n" +

        "Digite A, B ou C:"
    );


    if (
        resposta &&
        resposta.toUpperCase() === "B"
    ) {

        pontos += 20;

        atualizarPlacar();

        alert(
            "✅ Muito bem!\n\n" +
            "Você ganhou 20 pontos!"
        );

        vitoria();

    } else {

        pontos -= 5;

        atualizarPlacar();

        alert(
            "❌ Resposta incorreta!\n\n" +
            "Tente novamente."
        );

        perguntas();
    }
}


// ==============================
// VITÓRIA
// ==============================

function vitoria() {

    jogoTerminado = true;

    ctx.fillStyle =
        "rgba(0, 0, 0, 0.80)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle = "white";

    ctx.textAlign = "center";


    ctx.font = "50px Arial";

    ctx.fillText(
        "🏆 PARABÉNS!",
        canvas.width / 2,
        180
    );


    ctx.font = "27px Arial";

    ctx.fillText(
        "Você completou o EcoPlay!",
        canvas.width / 2,
        235
    );


    ctx.fillText(
        "🌎 Cuidou do planeta!",
        canvas.width / 2,
        280
    );


    ctx.fillText(
        "❤️ Cuidou da saúde!",
        canvas.width / 2,
        325
    );


    ctx.fillText(
        "📚 Aprendeu!",
        canvas.width / 2,
        370
    );


    ctx.fillText(
        "⭐ Pontuação: " + pontos,
        canvas.width / 2,
        425
    );


    ctx.textAlign = "left";
}


// ==============================
// REINICIAR
// ==============================

function reiniciar() {

    pontos = 0;

    fase = 1;

    jogoTerminado = false;

    jogador.x = 380;
    jogador.y = 230;

    teclas = {};

    criarObjetos();

    atualizarPlacar();

    if (!jogoIniciado) {
        iniciarJogo();
    }
}


// ==============================
// LOOP DO JOGO
// ==============================

function atualizar() {

    if (jogoTerminado) {
        return;
    }

    moverJogador();

    verificarColisoes();

    desenharFundo();

    desenharObjetos();

    desenharJogador();

    requestAnimationFrame(atualizar);
}
</script>

<script src="pwa.js"></script>
</body>
</html>
